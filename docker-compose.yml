services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh docker/entrypoint.sh
    depends_on:
      - mysql
      - redis
    networks:
      - todo_network

  nginx:
    image: nginx:1.27-alpine
    container_name: todo_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - todo_network

  mysql:
    image: mysql:8.0
    container_name: todo_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: todo_list
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "33066:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - todo_network

  redis:
    image: redis:7-alpine
    container_name: todo_redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    networks:
      - todo_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: todo_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - todo_network

  adminer:
    image: adminer:latest
    container_name: todo_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - todo_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -lc "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan queue:work --sleep=3 --tries=3 --timeout=90"
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - todo_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -lc "until [ -f vendor/autoload.php ]; do sleep 2; done; while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - todo_network

volumes:
  mysql_data:

networks:
  todo_network:
    driver: bridge
